"Enable Combat" = true
"Enable Death" = true
"Enable Farming" = true
"Enable Hunger & Health" = true
"Enable Items" = true
"Enable Mining" = true
"Enable Misc" = true
"Enable Mobs" = true
"Enable Movement" = true
"Enable Sleep" = true
"Enable World" = true

[Mobs]
	#Makes zombie siege happen to the player without the need of a village
	"Enable Zombie siege" = true
	#Changes to mobs equipment
	"Enable Equipment" = true
	"Enable Misc mobs" = true
	#Add a brand new Echo Torch and some changes to mob spawn
	"Enable Spawning" = true

	#Makes zombie siege happen to the player without the need of a village
	[Mobs."Zombie siege"]
		# Default: 20
		# Range: > 0
		"Zombies to spawn" = 20

	#Changes to mobs equipment
	[Mobs.Equipment]
		#Set the drop chance for mobs equipment.
		# Default: 0.5
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		"Drop chance" = 0.5
		#Set the drop chance for mobs equipment when spawned from spawners.
		# Default: 0.2
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		"Drop chance from spawners" = 0.2
		#Max durability of items dropped by mobs. This also fixes https://bugs.mojang.com/browse/MC-136374. Setting to 0 will disable this feature.
		# Default: 0.6
		# Range: 0.0 ~ 1.0
		"Max durability" = 0.6
		#All drops from mobs will be disenchanted.
		"Disenchant equipment" = false

	[Mobs."Misc mobs"]
		#1 in X chance each tick for mobs in the `insanesurvivaloverhaul:passive_regen` entity type tag to regain 1 health. Set to 0 to disable
		# Default: 200
		# Range: > 0
		"Passive regen chance" = 200
		#Instead of dealing magic and melee damage, guardians now only deal magic damage equal to their attack_damage attribute
		"Guardian magic damage only" = true
		#Iron golems no longer deal randomized damage, but fixed attack_damage attribute damage instead
		"Fixed iron golem damage" = true
		#Changes mobs loot and makes mobs drop reduced loot if not killed by a player
		"Loot changes" = true
		#If true, mobs will burn even if there's a block above them in daylight
		"Burn in sky light" = true

	#Add a brand new Echo Torch and some changes to mob spawn
	[Mobs.Spawning]
		#Disables Zombie Villagers
		"No zombie villagers" = true
		#Allows mobs to spawn in the world spawn (in vanilla mobs can't spawn in a 24 blocks radius from world spawn)
		"Allow world spawn spawn" = true
		#Disables normal skeletons from spawning in Fortresses.
		"Remove skeletons from fortresses" = true
		#Enables a data pack that makes Guardians spawn in deep oceans. These guardians have much less health compared to monument guardians and are smaller.
		"Guardians in deep oceans" = true
		#Radius (in blocks) around an Echo Lantern in which monsters cannot spawn.
		# Default: 64
		# Range: 1 ~ 128
		"Echo lantern radius" = 64
		#Guardians naturally spawned in deep oceans (from "Guardians in deep oceans") won't spawn above this Y level.
		# Default: 32
		# Range: > -2147483648
		"Max guardians in deep oceans spawn y" = 32

[Sleep]
	#Zombies drop cloth instead of Rotten Flesh. Cloth is used to make beds and various other stuff.
	"Enable Cloth" = true
	#Prevents sleeping if the player is not tired. Tiredness is gained by gaining exhaustion. Allows you to sleep during daytime if too tired. Energy Boost Items are controlled via json in this feature's folder
	"Enable Tiredness" = true

	#Zombies drop cloth instead of Rotten Flesh. Cloth is used to make beds and various other stuff.
	[Sleep.Cloth]
		#Enables a Data Pack that integrated Cloth:
		#* Makes zombies drop cloth instead of rotten flesh
		#* Beds require Cloth to be crafted
		#* Bundles can be made with Cloth
		#* Chainmail armor is made craftable with Cloth and chains
		#* Adds advancements for this feature and moves vanilla beds advancements to cloth advancement
		"Data pack" = true

	#Prevents sleeping if the player is not tired. Tiredness is gained by gaining exhaustion. Allows you to sleep during daytime if too tired. Energy Boost Items are controlled via json in this feature's folder
	[Sleep.Tiredness]
		#Multiply the tiredness gained by this value. Normally you gain tiredness equal to the exhaustion gained. 'Effective Hunger' doesn't affect the exhaustion gained.
		# Default: 1.0
		# Range: 0.0 ~ 128.0
		"Tiredness gain multiplier" = 1.0
		#Tiredness required to get the Tired effect and be able to sleep.
		# Default: 500.0
		# Range: 0.0 ~ 1.7976931348623157E308
		"Tiredness to effect" = 500.0
		#Every this Tiredness above 'Tiredness for effect' will add a new level of Tired.
		# Default: 250.0
		# Range: 0.0 ~ 1.7976931348623157E308
		"Tiredness per level" = 250.0
		#What to do with tiredness when the player dies.
		#RESET resets the tiredness to 0
		#KEEP keeps the current tiredness
		#SET_AT_EFFECT keeps the current tiredness but if higher than 'Tiredness to effect' it's set to that
		#REMOVE_ONE_LEVEL keeps the current tiredness but if higher than 'Tiredness to effect' removes one level of Tired to a minimum of I
		#Allowed Values: RESET, KEEP, SET_AT_EFFECT, REMOVE_ONE_LEVEL
		"On death behaviour" = "SET_AT_EFFECT"
		#Phantoms will no longer spawn based on insomnia, but instead based off tiredness. Will spawn with Tired III.
		"Tired tied phantoms" = true
		"Allow sleeping even when not tired" = false
		#If true, sets the playersSleepingPercentage gamerule to 1 so tired players can sleep no matter how many players on a server.
		"Force one player sleep" = true

		[Sleep.Tiredness."Energy boost"]
			#If the player has energy boost, reduce tiredness by this value (multiplied by the effect level) each tick.
			# Default: 0.025
			# Range: 0.0 ~ 1.7976931348623157E308
			"Tiredness reduction" = 0.025
			#By default if omitted in the json, food items will give 1 second of Energy Boost per effectiveness (hunger + saturation) of the food. This multiplies the duration of the effect
			# Default: 5.0
			# Range: 0.0 ~ 1.7976931348623157E308
			"Duration multiplier" = 5.0

		[Sleep.Tiredness."Fake sound"]
			#List of mobs (and optional dimension where they should play) that will have their ambience sound played when the player is tired
			Mobs = ["minecraft:skeleton,minecraft:overworld", "minecraft:zombie,minecraft:overworld", "minecraft:spider,minecraft:overworld", "minecraft:ghast,minecraft:the_nether", "minecraft:zombified_piglin,minecraft:the_nether"]

			#The cooldown (in ticks) between choosing a mob to play the fake sound. This is reduced with higher Tired effect levels
			[Sleep.Tiredness."Fake sound"."Cooldown between mobs"]
				# Default: 12000.0
				# Range: 0.0 ~ 1.7976931348623157E308
				Minimum = 12000.0
				# Default: 24000.0
				# Range: 0.0 ~ 1.7976931348623157E308
				Maximum = 24000.0

			#How many times will a fake sound of a mob play before going into cooldown
			[Sleep.Tiredness."Fake sound".Times]
				# Default: 2.0
				# Range: 0.0 ~ 1.7976931348623157E308
				Minimum = 2.0
				# Default: 6.0
				# Range: 0.0 ~ 1.7976931348623157E308
				Maximum = 6.0

[Farming]
	#Increase uses for bone meal and nerf its use on some plants
	"Enable Bone meal" = true
	#Slower breeding, Growing, Egging and Milking. Lower yield.
	"Enable Livestock" = true
	#Hoes can now scythe grass and flowers. Also makes them break faster when tilling farmland
	"Enable Hoes" = true
	#Crops tweaks and less yield from crops
	"Enable Crops" = true
	#Slower Plants (non-crops) growing. Plants properties are controlled via data packs
	"Enable Plants growth" = true

	#Increase uses for bone meal and nerf its use on some plants
	[Farming."Bone meal"]
		#Vanilla is 20
		# Default: 50
		# Range: > 0
		"Composter time to produce" = 50
		#If true, you can bone meal dirt that's near a grass block (or below tall grass) to get grass block.
		"Bone meal dirt to grass" = true
		#Makes bone meal have a chance to fail on Cave Vines, Saplings and Sweet Berry Bushes. Also makes rotten flesh compostable.
		"Data pack" = true

		[Farming."Bone meal"."Rich farmland"]
			#Bone meal used on Farmland (or crouch right clicked on crops) transforms it into Rich Farmland.
			Enable = false
			#How many extra random ticks does Rich Farmland give to the crop sitting on top?
			# Default: 4
			# Range: > 1
			"Extra ticks" = 4
			#Chance for a Rich farmland to decay back to farmland
			# Default: 0.35
			# Range: 0.0 ~ 1.0
			"Chance to decay" = 0.35
			#Prevents bone meal from working on crops and will just create rich farmland on right-click
			"Disable bone meal" = true

		#How many stages will bone meal make stuff grow?
		[Farming."Bone meal"."Stage growth"]
			# Default: 1.0
			# Range: 0.0 ~ 25.0
			Minimum = 1.0
			# Default: 1.0
			# Range: 0.0 ~ 25.0
			Maximum = 1.0

		#How many stages will cactus and sugar canes grow with one bone meal. Set to 0 to disable.
		[Farming."Bone meal"."Bone meal canes and cactus"]
			# Default: 1.0
			# Range: 0.0 ~ 1.7976931348623157E308
			Minimum = 1.0
			# Default: 4.0
			# Range: 0.0 ~ 1.7976931348623157E308
			Maximum = 4.0

	#Slower breeding, Growing, Egging and Milking. Lower yield.
	[Farming.Livestock]
		#Changes the chance for a chicken to come out from an egg (1 in this value). Vanilla is 8
		# Default: 8
		# Range: > -2147483648
		"Chicken from egg chance" = 8
		#Seconds until you can milk cows (or stew mooshrooms)
		# Default: 1200
		# Range: > 0
		"Fluid cooldown" = 1200
		#If true, animals will no longer be able to be bred manually. Only animals in insanesurvivaloverhaul:prevent_breeding will be affected by this.
		"Prevent breeding" = true
		#If true, mobs can randomly fall in love and possibly breed
		"Auto breed" = true
		#Enables a data pack that changes animal loot (reduced food drops) and slows down growing, breeding, egging etc
		"Data pack" = true

		[Farming.Livestock."Well fed"]
			#If true, animals will be 'well fed' for this ticks when fed. During this time they have an higher chance (given by the livestock data) to breed. Set to 0 to disable.
			# Default: 60
			# Range: > 0
			Duration = 60
			#How much well fed time must be left to the entity to be able to feed it again.
			# Default: 30
			# Range: > 0
			"Left to feed again" = 30
			#How much well fed time is consumed when animals breed.
			# Default: 20
			# Range: > 0
			"Consumed on breed" = 20

		[Farming.Livestock.Aging]
			#If true, animals will age and die of old age. Configurable via data packs. With the data pack enabled, adult will drop more goodies. With pehkui installed, animals will also be smaller/bigger.
			Enable = true
			#If true, animals die of old age.
			"Die of old age" = true
			#If Die of old age is disabled you can still make animals grow up to this age
			#Allowed Values: YOUNG, ADULT, ELDER
			"Stop at" = "ELDER"
			#If fed a poisonous potato, animals will stop aging at a 'Stop At With Poisonous Potato' age.
			"Stop aging with poisonous potato" = true
			#If true, animals will die if not young and haven't been fed in a while.
			"Starvation death" = false

	#Hoes can now scythe grass and flowers. Also makes them break faster when tilling farmland
	[Farming.Hoes]
		# Default: 4
		# Range: > 1
		"Durability on right click" = 4
		#'Durability on right click' is only applied for farmland, and not e.g. when using hoes on rooted or coarse dirt
		"Extra durability only for tilling" = true

	#Crops tweaks and less yield from crops
	[Farming.Crops]
		#Set if crops require wet farmland to grow.
		#Valid Values:
		#NO: Crops will not require water to grow
		#BONE_MEAL_ONLY: Crops will grow on dry farmland by only using bone meal
		#ANY_CASE: Will make Crops not grow in any case when on dry farmland
		#Allowed Values: NO, BONE_MEAL_ONLY, ANY_CASE
		"Crops require water" = "BONE_MEAL_ONLY"
		#Radius where water hydrates farmland, vanilla is 4.
		# Default: 2
		# Range: > 1
		"Water hydration radius" = 2
		#Makes potatoes and carrots not plantable and also enables a data pack that makes the following changes:
		#* Makes all vanilla crops drop only one seed (and makes carrots and potatoes drop the new seed item)
		#* Makes crops hard to break, requiring an hoe as correct tool
		#* Makes melon seeds and pumpkin seeds harder to obtain
		#* Removes carrots and potato drops from zombies
		#* Removes wheat seeds from tall grass
		#* Makes wild crops generate in the world
		"Data pack" = true
		#If true, villagers will be able to pick up and (farmers) plant mod's seeds and rooted items. Also prevents villagers from trampling farmland
		"Fix villagers" = true

	#Slower Plants (non-crops) growing. Plants properties are controlled via data packs
	[Farming."Plants growth"]
		"Huge mushrooms on mycelium only" = true
		#If != 1, cave vines will grow this slower above sea level or if they can see the sky light. This is multiplied to the plant_growth_modifiers multipliers
		# Default: 3.0
		# Range: 0.0 ~ 1.7976931348623157E308
		"Cave vines underground" = 3.0
		#If true, a data pack is enabled that changes the growth of plants based off various factors, such as sunlight and biome
		"Data pack" = true

[Movement]
	"Enable Boats" = true
	"Enable Swimming" = true
	#Slowdown based off the terrain entities walking on. Custom Terrain Slowdown are controlled via json in this feature's folder
	"Enable Terrain slowdown" = true
	"Enable Minecarts" = true
	#Players's slowed down when walking backwards.
	"Enable Backwards slowdown" = true
	#Players's slides down climbable blocks faster and stands still when opening an interface
	"Enable Better climbable" = true
	#Armor slows down the player. Enchantment Weights are controlled via json in this feature's folder. Please note that default mods' armor slowdown is done through item definitions within the combat_rework data pack
	"Enable Weighted armor" = false
	#Players's slowed down for a brief moment when hit.
	"Enable Tagging" = true
	"Enable Elytra" = true
	"Enable Sprinting" = true

	[Movement.Boats]
		#If true, boats will no longer go stupidly fast on ice. (If quark is present this is disabled)
		"No ice boat" = true
		#If true, boats will always break when falling from this height or more instead of being glitched
		# Default: 5.0
		# Range: 0.0 ~ 1.7976931348623157E308
		"Break height" = 5.0

	[Movement.Swimming]
		#Prevents swimming up really fast if swimming and holding the jump key. Only applies to water.
		"Prevent fast swim up with jump" = true

	#Slowdown based off the terrain entities walking on. Custom Terrain Slowdown are controlled via json in this feature's folder
	[Movement."Terrain slowdown"]
		"Frost walker reduces ice slowdown" = true
		#If true, snow slowdown is ignored if wearing leather boots (or any item in insanesurvivaloverhaul:snow_slowdown_ignore item tag)
		"Snow slowdown ignored with leather boots" = true

	[Movement.Minecarts]
		#If true, minecarts with entities in them and chest minecarts will force load chunks, allowing them to travel in unloaded chunks. It's advised to not leave too many minecarts with entities and with chests lying around, as they will keep chunks loaded.
		"Entity and chest minecarts force load chunks" = true
		#If true, enables a data pack that makes rails cheaper and adds recipes for new rail. Also adds a global loot modifier that replaces vanilla rails with golden powered rails
		"Data pack" = true

	#Players's slowed down when walking backwards.
	[Movement."Backwards slowdown"]
		#How much slower will the player go when walking backwards.
		# Default: 0.3
		# Range: 0.0 ~ 1.0
		Slowdown = 0.3

	#Players's slides down climbable blocks faster and stands still when opening an interface
	[Movement."Better climbable"]
		#Speed at which players move up climbable blocks. Vanilla is 0.2
		# Default: 0.3
		# Range: 0.0 ~ 5.0
		"Climb speed" = 0.3
		#How much faster players move down climbable blocks.
		# Default: 0.2
		# Range: 0.0 ~ 5.0
		"Descend speed" = 0.2
		#If true, and not looking down, player will crouch when opening an interface.
		"Crouch when opening interface" = true
		#Entities will not count as on climbable when on the ground, preventing slowdown when passing through climbable blocks.
		"Not on climbable when on ground" = true
		#If enabled you'll only be able to climb when pressing jump and not when against a wall and moving.
		"Only climb with jump" = true
		#If true, a data pack will be enabled that will make players take damage when falling on climbable blocks.
		"Fall damage on climbable" = true

	#Armor slows down the player. Enchantment Weights are controlled via json in this feature's folder. Please note that default mods' armor slowdown is done through item definitions within the combat_rework data pack
	[Movement."Weighted armor"]
		#Formula to calculate the slowdown of a piece of armor. Variables available are: armor, armor_toughness. This is evaluated with EvalEx https://ezylang.github.io/EvalEx/concepts/parsing_evaluation.html. Please note that 1 means 100% slowdown. Regenerating Absorption counts as Toughness
		"Slowdown formula" = "(armor * 0.01) * (1 + (armor_toughness * 0.05))"

	#Players's slowed down for a brief moment when hit.
	[Movement.Tagging]
		#Which level of Slowness is applied to the player (level 0 is Slowness I).
		# Default: 0
		# Range: 0 ~ 10
		"Slowness level" = 0
		#Slowness is applied for damage_taken * this_value ticks.
		# Default: 7
		# Range: 0 ~ 100
		"Duration multiplier" = 7

	[Movement.Elytra]
		#How much the player is slowed down when gliding. Only applies outside the End Dimension. Vanilla is 0.99
		# Default: 0.975
		# Range: 0.0 ~ 1.0
		"Air resistance" = 0.975
		#Target speed multiplier for firework boost when gliding. Lower = slower max speed. Vanilla is 1.5
		# Default: 1.25
		# Range: 0.0 ~ 1.7976931348623157E308
		"Firework boost target speed" = 1.25
		#How aggressively each tick pushes toward target speed when firework boosting. Lower = slower acceleration. Vanilla is 0.5
		# Default: 0.2
		# Range: 0.0 ~ 1.7976931348623157E308
		"Firework boost lerp" = 0.2
		#If true, you can take of with Elytra and fireworks while off ground, no need to be gliding. Just jump and 
		"Firework boost off ground" = true

	[Movement.Sprinting]
		#Player can only sprint when have at least this much hunger. Vanilla is 7
		# Default: 1
		# Range: 0 ~ 20
		"Min hunger" = 1
		#Movement speed penalty when below this hunger
		# Default: 7
		# Range: 0 ~ 20
		"Speed penalty below hunger" = 7
		#How much less movement speed per hunger below 'Speed Penalty below hunger' sprinting players have. Vanilla gives 0.3 bonus movement speed when sprinting
		# Default: 0.025
		# Range: 0.0 ~ 1.7976931348623157E308
		"Speed reduction each hunger" = 0.025

[World]
	#Spawners are now a challenge. Monsters spawning from spawners ignore light.
	"Enable Spawners" = true
	"Enable Berries" = true
	"Enable Fluids" = true
	#Control fire speed with insanesurvivaloverhaul:fire_speed_multiplier game rule. This feature also enables a recipe to get a flint from 3 gravel.
	"Enable Coal & Fire" = true
	"Enable Nether" = true

	[World."Day night cycle"]
		#How many minutes does a full day last? This DOESN'T CHANGE the day night cycle duration, but it's only used for calculations in case you change it with another mod.
		# Default: 20.0
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		"Day night cycle duration" = 20.0

	#Spawners are now a challenge. Monsters spawning from spawners ignore light.
	[World.Spawners]
		#If true, the spawner delay is set to 'Delay' instead of using MinSpawnDelay and MaxSpawnDelay
		"Override spawn delay" = true
		#Range in which a player must be present for a spawner to work. Vanilla is 16.
		"Required player range" = 24
		#If true, monsters from spawners will spawn no matter the light level.
		"Ignore light" = true
		#If true, disabled spawners can be re-enabled with a spawner reactivator item defined in the `insanesurvivaloverhaul:spawner_reactivator` item tag. These items get a new tooltip mentioning that they can be used to re-enable spawners.
		"Re-enable with Spawner Reactivator" = true
		#If enabled, spawner will play a sound effect when spawning mobs
		"Spawning sound effect" = true

		#Spawning Delay (in ticks) of the spawner. Vanilla is 200~800. Requires 'Override Spawn Delay' to be enabled.
		[World.Spawners.Delay]
			# Default: 400.0
			# Range: 1.0 ~ 1.7976931348623157E308
			Minimum = 400.0
			# Default: 1600.0
			# Range: 1.0 ~ 1.7976931348623157E308
			Maximum = 1600.0

		[World.Spawners."Disable spawners"]
			#If true, spawners will be disabled after spawning a certain amount of mobs. This is not compatible with empowered spawners.
			Enabled = false
			#The minimum amount of spawnable mobs (when the spawner is basically in the same position as the world spawn). The amount of spawnable mobs before deactivating is equal to the distance divided by 8 (plus this value). E.g. At 160 blocks from spawn the max spawnable mobs will be 160 / 8 + 20 = 20 + 20 = 40
			# Default: 20
			# Range: > 0
			"Min spawnable mobs" = 20
			#This multiplier increases the max mobs spawned.
			# Default: 1.0
			# Range: 0.0 ~ 1.7976931348623157E308
			"Spawnable mobs multiplier" = 1.0

		[World.Spawners.Empowered]
			#If true, spawners will generate in an empowered state. When empowered, will generate mobs really fast for a while and then will disable. This is not compatible with disable spawners.
			Enabled = true
			#When the spawner stops being empowered, it is disabled and will stop spawning mobs.
			"Disable on end" = true
			#How many mobs are spawned before empowered ends.
			# Default: 20
			# Range: > 0
			"Mobs amount" = 20
			#When the Spawner stops being empowered, will generate loot from the insanesurvivaloverhaul:empowered_spawner loot table
			"Loot Reward" = false
			#When the Spawner stops being empowered, will play a sound effect
			"Sound effect" = true

			#Spawning Delay (in ticks) when the Spawner is empowered.
			[World.Spawners.Empowered.Delay]
				# Default: 150.0
				# Range: 1.0 ~ 1.7976931348623157E308
				Minimum = 150.0
				# Default: 300.0
				# Range: 1.0 ~ 1.7976931348623157E308
				Maximum = 300.0

			#When the Spawner stops being empowered, will generate this amount of experience
			[World.Spawners.Empowered."Experience Reward"]
				# Default: 0.0
				# Range: 0.0 ~ 1.7976931348623157E308
				Minimum = 0.0
				# Default: 0.0
				# Range: 0.0 ~ 1.7976931348623157E308
				Maximum = 0.0

		[World.Spawners."Reactivated spawners"]
			#The range of a player nearby in which the spawner will be active. Setting to -1 should keep the spawners always active (untested) as long as the chunk is loaded (hostiles will still despawn in a 128 block radius).
			# Default: 128
			# Range: > -1
			"Player range" = 128
			#Reactivated spawners spawn mobs no matter the light level.
			"Ignore light" = false

			#How many ticks will the spawner try to summon mobs.
			[World.Spawners."Reactivated spawners".Delay]
				# Default: 3600.0
				# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
				Minimum = 3600.0
				# Default: 6000.0
				# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
				Maximum = 6000.0

	#Thunderstorm Intensity. Disable it via gamerule: insanesurvivaloverhaul:thunderstormIntensity
	[World.Thunderstorms]
		#Minimum thunderstorm intensity.
		# Default: 1
		# Range: > 1
		"Min Intensity" = 1
		#Maximum thunderstorm intensity.
		# Default: 15
		# Range: > 1
		"Max Intensity" = 15
		#Base duration of each intensity step (in minutes). Lasts less and less the higher the intensity.
		# Default: 4
		# Range: > 1
		"Base Duration" = 4

	[World.Berries]
		#Berry bushes no longer deal damage when walking in them with leggings and boots
		"No damage if dressed" = true
		#	Makes sweet berries not plantable, requiring seeds, and also enables a data pack that makes the following changes:
		#	* Makes sweet berry bushes drop seeds
		#	* Makes sweet berry patches rarer
		#	* Makes sweet berry patches have less plants and plants will not be all grown up
		#
		"Data pack" = true

	[World.Fluids]
		#If enabled, water will deal fall damage if too shallow
		"Water fall damage" = true
		#How strong does water push entities. Vanilla is 0.014
		# Default: 0.028
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
