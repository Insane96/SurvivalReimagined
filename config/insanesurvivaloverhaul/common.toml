		#	* Makes sweet berry patches rarer
		#	* Makes sweet berry patches have less plants and plants will not be all grown up
		#
		"Data pack" = true

	#Data packs of Nether.
	[World.Nether]
		#Enables a data pack that makes the nether 128 blocks high instead of 256, effectively disabling the "Nether Roof" and reduces the 8 block ratio between nether and other dimensions to 2. This will break if another mod changes the nether dimension
		"Disable Nether Roof and reduce block ratio" = false

	#Data packs of Coal & Fire.
	[World."Coal fire"]
		#If enabled, a data pack will be enabled that:
		#* Removes the Charcoal recipe from smelting
		#* Makes Coal Ore require an Iron Pickaxe or better to mine
		#* Replaces Flint and Steel in the overworld with firestarter
		#* Changes flint and steel recipe to require blaze powder
		"No charcoal smelting and iron coal" = true

["Hunger & Health"]
	#Data packs of Foods & Drinks.
	"Enable Food drinks" = true

	#Data packs of Foods & Drinks.
	["Hunger & Health"."Food drinks"]
		#Enables a data pack that makes food no longer smeltable in furnaces and changes smokers recipe to require soul sand.
		#This also enables a change to the smelt_item_function in loot tables to use smoker recipes instead of furnaces (otherwise, mobs wouldn't drop cooked food). Might have unintended side effects.
		"No furnace food and smoker recipe" = true
		#Enables a data pack that rebalances some foods and makes raw foods poisonous. Also allows mushroom stews to be crafted with any mushroom and removes golden apples.
		"Food changes" = true

