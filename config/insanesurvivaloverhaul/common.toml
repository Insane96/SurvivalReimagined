	[Combat.Snowballs]
		#Enables a data pack that increases snowballs stack size to 64
		"Snowball stack size" = true

	#Data packs of Critical Rework.
	[Combat."Critical rework"]
		#Enables a data pack that adds the Critical enchantment (max level V). Each level increases critical chance by 10% and critical damage by 5%. It's incompatible with other damage enchantments (Sharpness, Smite, Bane of Arthropods, Impaling, Density, Breach).
		"Critical enchantment data pack" = true

	#Data packs of Piercing Damage.
	[Combat."Piercing damage"]
		#Enables a data pack that adds the Armor Piercer enchantment (max level V). Each level grants bonus Piercing Damage scaled by the weapon's Attack Damage (see armorPiercerDamagePerAttackDamage). It's incompatible with other damage enchantments (Sharpness, Smite, Bane of Arthropods, Impaling, Density, Breach, Critical).
		"Armor piercer enchantment data pack" = true

	#Data packs of Sweep Overhaul.
	[Combat."Sweep overhaul"]
		#Enables a data pack that removes the Sweeping Edge enchantment and (if Rune Enchanting is installed) the Sweeping Edge rune
		"Data pack" = true

