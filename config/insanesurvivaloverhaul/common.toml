[Mining]
	#Data packs for materials and ores.
	"Enable Materials and ores" = true
	#Enables a Data Pack that generates large ore veins underground. On the surface you can find ore rocks indicating a huge vein below.
	"Enable Big ore veins" = true
	#Change, through data packs, some blocks properties, from hardness to explosion resistance to speed and jump factors to bone meal chance to fail.
	"Enable Block definition" = true
	#Data and resource packs of Anvil Crafting.
	"Enable Anvil crafting" = true
	#Enables the data pack with the Blast Furnace recycling recipes.
	"Enable Recycling" = true

	#Data packs for materials and ores.
	[Mining."Materials and ores"]
		#Enables a data pack that removes the vanilla feature of discarding ores if exposed to air. This applies to: coal, diamonds, gold and lapis
		"Ore generation overhaul" = true
		#Enables a data pack with the following changes:
		#* Stone (Broken with a non Silk-Touch tool) can drop Iron Nuggets
		#* Silverfish can drop Iron Nuggets
		"Farmable iron data pack" = false
		#Enables the following changes to vanilla data pack:
		#* Smelting Raw Copper and Raw Iron takes 2x time
		#* Blasting raw minerals takes 1x time
		#* Blasting ores now takes 2x time but yields 2x materials from minerals (2x the normal drops without Fortune), and yields 3x raw minerals for iron, gold and copper
		#* You can no longer smelt anything other than Raw Copper and Raw Iron. A Blast Furnace is required
		#* Heavily increased experience from smelting ores
		#
		"Ore smelting" = true

	#Change, through data packs, some blocks properties, from hardness to explosion resistance to speed and jump factors to bone meal chance to fail.
	[Mining."Block definition"]
		#Enables the built-in block definitions data pack, which changes the following:
		#Makes Ancient Debris, Ender Chests, Obsidian, powder snow, spawners, wooden trapdoors easier to break.
		#Budding Amethyst, Leaves, Netherrack, nylium harder to break.
		#Makes Ores harder to break.
		#Makes Copper, Gold, Iron ores, Amethyst clusters drop xp. Sculk Catalyst and Spawners drop moar xp.
		"Data pack" = true

	#Data and resource packs of Anvil Crafting.
	[Mining."Anvil crafting"]
		#Enables a data pack that replaces vanilla metal equipment recipes requiring an anvil
		"Metal equipment in anvil" = true

[Misc]
	#Resource and data packs
	"Enable Packs" = true
	#Data packs of Potions and Effects.
	"Enable Potions and effects" = true
	#Enables a data pack that changes fireworks recipes:
	#* Firework Rockets recipes output 5 instead of 3
	#* Firework Stars recipe outputs 2 instead of 1
	#* Firework Stars can be added to already crafted Firework Rockets
	"Enable Fireworks" = true

	#Resource and data packs
	[Misc.Packs]
		#If true, no integrated data pack will be loaded
		"Disable all data packs" = false
		#If true a data pack will be enabled that disables villages, pillagers outpost and mansions generation.
		"Disable long noses structures" = true
		#If true a data pack will be enabled that makes furnaces require copper. Copper ingots can be obtained from raw copper on campfires.
		"Copper furnace" = true
		#Changes vanilla torch recipes.
		#* Torches can be only made on Campfires early on in the game
		#* With shears you can make 4 torches out of coal
		#* With Fire Charges you can make more of them later in the game without needing grass.
		"Hardcore torches" = true
		#Minor changes:
		#* Cakes now drop when broken and not eaten
		#* Clay balls can be crafted from blocks
		#* Leads and Sticky Pistons can also be made with Honey
		#* Iron Doors can be blasted back to Iron Ingots
		#* Dispensers can be made from droppers
		#* Levers and glass can now be broken faster with pickaxes, cactus with hoes
		#* Chains are easier to craft with just nuggets
		#* Wool can be crafted back to strings
		#* Carpets, Bricks, Banners, Targets and Tnt recipes now outputs more
		#* Tnt recipe now also accepts paper instead of sand
		#* Moss carpets can be crafted back to moss blocks
		#* Logs smelt 4 items instead of 1.5 when used as furnace fuel
		#* Dried Kelp Blocks smelt 16 items instead of 20 when used as furnace fuel
		#* Lava smelts 256 items instead of 100
		"Misc tweaks" = true
		#Makes redstone components require redstone in their recipe (e.g. Levers, pressure plates, etc).
		"Actual redstone components" = true
		#Lowers the giant mushrooms generated in a Roofed forests forests as well as removes the non-dark oak trees
		"Dark forest vegetation" = true
		#If true, a data pack will be enabled that makes End Cities more common.
		"Increase end cities" = true
		#Reworks Prismarine, Dark Prismarine and Sea Lantern recipes to no longer need Prismarine Shards/Crystals:
		#* Prismarine is now made with Copper and Calcite
		#* Dark Prismarine is made easier, out of Prismarine blocks instead of shards
		#* Sea Lantern is now made out of Prismarine and Glowstone Dust
		#Guardians no longer drop Prismarine Shards/Crystals (they drop Wet Sponge and (Cooked) Cod instead), Elder Guardians roll the fishing loot table instead, and Sea Lanterns always drop themselves when broken.
		#Any leftover Prismarine Shard drop from other sources is replaced with 40% as many Turtle Scutes, and any leftover Prismarine Crystals drop is replaced with 40% as many Nautilus Shells.
		"Prismarine rework" = true
		#Makes saplings no longer drop from trees. Instead, you can craft them from leaves
		"Craftable saplings" = true
		#If true, a data pack will be enabled that changes animal loot (reduced food drops) and adds livestock data that slows down growing, breeding, egg laying, etc.
		Livestock = true

	#Data packs of Potions and Effects.
	[Misc."Potions and effects"]
		#Enables a data pack that increases potions stack sizes
		"Potion stack size" = true

